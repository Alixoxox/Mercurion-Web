<header class="fixed top-0 w-full bg-white border-b border-gray-200 z-50">
  <nav class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
    <a routerLink="/" class="text-lg sm:text-xl font-bold text-gray-900 tracking-tight pr-3">meezan</a>

    <div class="flex items-center gap-3 sm:gap-4">
      <ng-container *ngIf="userService.loggedIn()">
        <a routerLink="/cart" class="relative inline-flex text-gray-500 hover:text-gray-900 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
          <span *ngIf="cartCount() > 0" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full min-w-5 h-5 px-1 flex items-center justify-center">
            {{ cartCount() }}
          </span>
        </a>
      </ng-container>

      <a routerLink="/about" class="sm:inline text-sm text-gray-500 hover:text-gray-900 font-medium transition">About</a>
      <a routerLink="/contact" class="sm:inline text-sm text-gray-500 hover:text-gray-900 font-medium transition">Contact</a>

      <ng-container *ngIf="userService.loggedIn(); else guestLinks">
        <div class="flex items-center gap-2 sm:gap-3">
          <button (click)="userService.logout()" class="text-sm text-gray-500 hover:text-red-500 font-medium transition cursor-pointer">Logout</button>
        </div>
      </ng-container>

      <ng-template #guestLinks>
        <div class="flex items-center gap-2 sm:gap-3">
          <a routerLink="/auth/login" class="bg-blue-600 hover:bg-blue-700 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium transition">Login</a>
        </div>
      </ng-template>
    </div>
  </nav>
</header>
