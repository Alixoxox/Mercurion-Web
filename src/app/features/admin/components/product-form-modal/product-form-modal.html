<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" (click)="close.emit()"></div>
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold text-gray-900">{{ product ? 'Edit Product' : 'Add Product' }}</h2>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
        <input formControlName="title" placeholder="Product name"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
        <p *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="mt-1 text-sm text-red-500">Title is required</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
          <input type="number" formControlName="price" min="0" step="0.01"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
          <p *ngIf="form.get('price')?.invalid && form.get('price')?.touched" class="mt-1 text-sm text-red-500">Enter a price ≥ 0</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
          <input type="number" formControlName="stock" min="0"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
          <p *ngIf="form.get('stock')?.invalid && form.get('stock')?.touched" class="mt-1 text-sm text-red-500">Enter stock ≥ 0</p>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <div #categoryWrap class="relative inline-block w-full" (mouseenter)="categoryOpen.set(true)" (mouseleave)="categoryOpen.set(false)">
          <button type="button" (click)="categoryOpen.set(!categoryOpen())"
            class="w-full inline-flex items-center justify-between gap-x-1.5 rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-900 border border-gray-300 hover:bg-gray-50 transition cursor-pointer focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            <span class="flex-shrink-0">{{ (form.get('category')?.value || 'Select category') | titlecase }}</span>
            <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path clip-rule="evenodd" fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" />
            </svg>
          </button>
          <div *ngIf="categoryOpen()" class="absolute left-0 right-0 z-20 mt-2 w-full origin-top rounded-md bg-white py-1 ring-1 ring-inset ring-gray-200 shadow-lg max-h-56 overflow-y-auto">
            <button *ngFor="let cat of categories" type="button" (click)="selectCategory(cat)"
              class="block w-full px-4 py-2 text-left text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition cursor-pointer whitespace-nowrap">
              {{ cat | titlecase }}
            </button>
          </div>
        </div>
        <p *ngIf="form.get('category')?.invalid && form.get('category')?.touched" class="mt-1 text-sm text-red-500">Category is required</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Image</label>
        <div class="flex gap-2">
          <input formControlName="image" placeholder="Paste image URL..."
            class="flex-1 min-w-0 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
          <input #imageInput type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
          <button type="button" (click)="imageInput.click()"
            class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 font-medium">Upload</button>
        </div>
        <p class="mt-1 text-xs text-gray-400">Upload an image or paste a URL</p>
        <img *ngIf="previewImage || form.get('image')?.value" [src]="previewImage || form.get('image')?.value" alt="preview"
          class="mt-2 w-20 h-20 object-cover rounded-lg border border-gray-200" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="3" maxlength="254"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button type="button" (click)="close.emit()"
          class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">Cancel</button>
        <button type="submit" [disabled]="form.invalid || saving"
          class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium">{{ saving ? 'Saving…' : 'Save' }}</button>
      </div>
    </form>
  </div>
</div>
