<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-black/50" (click)="close.emit()"></div>
  <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-semibold text-gray-900">Bulk Import (CSV)</h2>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">✕</button>
    </div>

    <div
      (dragover)="dragging.set(true); $event.preventDefault()"
      (dragleave)="dragging.set(false)"
      (drop)="onDrop($event)"
      class="border-2 border-dashed rounded-xl p-8 text-center cursor-pointer"
      [class.border-blue-400]="dragging()" [class.border-gray-300]="!dragging()">
      <input #fileInput type="file" accept=".csv" class="hidden" (change)="onFileSelected($event)" />
      <p class="text-gray-600 mb-1">Drag &amp; drop a CSV here, or</p>
      <button type="button" (click)="fileInput.click()" [disabled]="uploading()"
        class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium">
        {{ uploading() ? 'Uploading...' : 'Choose file' }}
      </button>
      <p class="text-xs text-gray-400 mt-3">Uploads to /product/bulk — the backend parses the CSV</p>
    </div>

    <p *ngIf="fileName() && !uploading()" class="mt-3 text-sm text-gray-600">Selected: <span class="font-medium">{{ fileName() }}</span></p>

    <div class="flex justify-end mt-5">
      <button (click)="close.emit()" [disabled]="uploading()"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">Close</button>
    </div>
  </div>
</div>
