<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex items-center justify-between mb-8">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">All Products</h1>
    <span *ngIf="userService.loggedIn()" class="text-sm font-medium text-gray-500">
      Total Spent: <span class="text-gray-900 font-bold">{{ totalSpent() | currency }}</span>
    </span>
  </div>

  <div class="flex flex-wrap items-center gap-2 mb-6">
    <div class="relative w-full sm:flex-1 sm:w-auto">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 20">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
        </svg>
      </div>
      <input type="search" id="search"
             class="block w-full ps-9 pe-3 py-2 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 placeholder-gray-400"
             placeholder="Search products..." [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)" />
    </div>

    <div #categoryWrap class="relative inline-block shrink-0" (mouseenter)="categoryOpen.set(true)" (mouseleave)="categoryOpen.set(false)">
      <button type="button" (click)="categoryOpen.set(!categoryOpen())" class="inline-flex items-center justify-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-200 hover:bg-gray-50 transition cursor-pointer">
        <span class="flex-shrink-0">{{ (selectedCategory() || 'All Categories') | titlecase }}</span>
        <svg class="-mr-1 h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path clip-rule="evenodd" fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" />
        </svg>
      </button>
      <div *ngIf="categoryOpen()" class="absolute left-0 sm:right-0 sm:left-auto z-20 mt-2 w-56 origin-top-left sm:origin-top-right rounded-md bg-white py-1 ring-1 ring-inset ring-gray-200 shadow-lg">
        <button (click)="selectedCategory.set(null); onFilterChange(); categoryOpen.set(false)"
                class="block w-full px-4 py-2 text-left text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition cursor-pointer whitespace-nowrap">
          All Categories
        </button>
        <button *ngFor="let cat of productService.categories()" (click)="selectedCategory.set(cat); onFilterChange(); categoryOpen.set(false)"
                class="block w-full px-4 py-2 text-left text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition cursor-pointer whitespace-nowrap">
          {{ cat | titlecase }}
        </button>
      </div>
    </div>

    <div #sortWrap class="relative inline-block shrink-0" (mouseenter)="sortOpen.set(true)" (mouseleave)="sortOpen.set(false)">
      <button type="button" (click)="sortOpen.set(!sortOpen())" class="inline-flex items-center justify-center gap-x-1.5 rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 ring-1 ring-inset ring-gray-200 hover:bg-gray-50 transition cursor-pointer">
        <span class="flex-shrink-0">{{ getSortLabel() }}</span>
        <svg class="-mr-1 h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path clip-rule="evenodd" fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" />
        </svg>
      </button>
      <div *ngIf="sortOpen()" class="absolute left-0 sm:right-0 sm:left-auto z-20 mt-2 w-56 origin-top-left sm:origin-top-right rounded-md bg-white py-1 ring-1 ring-inset ring-gray-200 shadow-lg">
        <button *ngFor="let opt of sortOptions" (click)="sortBy.set(opt.value); onFilterChange(); sortOpen.set(false)"
                class="block w-full px-4 py-2 text-left text-sm text-gray-600 hover:bg-gray-50 hover:text-gray-900 transition cursor-pointer whitespace-nowrap">
          {{ opt.label }}
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading()">
    <div class="flex items-center justify-center gap-3 mb-6">
      <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="text-sm text-gray-500 font-medium">Loading products...</span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let _ of [1,2,3,4,5,6,7,8]" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-pulse h-full flex flex-col">
        <div class="aspect-square bg-gray-100 shrink-0"></div>
        <div class="p-4 space-y-3 flex-1 flex flex-col">
          <div class="h-4 bg-gray-100 rounded w-1/4"></div>
          <div class="h-4 bg-gray-100 rounded w-3/4"></div>
          <div class="h-5 bg-gray-100 rounded w-1/3 mt-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="error()" class="text-center py-16">
    <p class="text-red-500 mb-4">{{ error() }}</p>
    <button (click)="ngOnInit()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
      Try Again
    </button>
  </div>

  <div *ngIf="!loading() && !error() && productService.products().length === 0 && !hasActiveFilters()" class="text-center py-16">
    <p class="text-gray-500 text-lg">No products found.</p>
  </div>

  <div *ngIf="!loading() && !error() && productService.products().length === 0 && hasActiveFilters()" class="text-center py-16">
    <p class="text-gray-500 text-lg mb-4">No products match your filters.</p>
    <button (click)="clearFilters()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition cursor-pointer">
      Clear Filters
    </button>
  </div>

  <div *ngIf="!loading() && !error() && productService.products().length > 0">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of productService.products() "
      [product]="product"
      [isLoggedIn]="userService.loggedIn()"
      [isInCart]="isInCart(product)"
      [isStockLimitReached]="isStockLimitReached(product)"
      [isLiked]="userService.isWishlisted(product.id)"
      (addToCart)="onAddToCart($event)"
      (deleteFromCart)="deleteFromCart($event)"
      (like)="onToggleLike($event)"/>
    </div>

    <div class="flex flex-col items-center gap-3 mt-8">
      <span class="text-sm text-gray-600 font-medium">{{ rangeLabel() }}</span>
      <div class="flex items-center gap-2">
        <button (click)="goToPage(currentPage() - 1)" [disabled]="currentPage() === 1"
                class="px-3 py-2 text-sm font-medium rounded-lg transition cursor-pointer
                       bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed">
          &larr;
        </button>
        <button *ngFor="let pg of pageNumbers()" (click)="goToPage(pg)"
                [class.bg-blue-600]="pg === currentPage()"
                [class.text-white]="pg === currentPage()"
                [class.bg-gray-100]="pg !== currentPage()"
                [class.hover:bg-gray-200]="pg !== currentPage()"
                [class.text-gray-700]="pg !== currentPage()"
                class="min-w-9 px-3 py-2 text-sm font-medium rounded-lg transition cursor-pointer">
          {{ pg }}
        </button>
        <button (click)="goToPage(currentPage() + 1)" [disabled]="currentPage() === totalPages()"
                class="px-3 py-2 text-sm font-medium rounded-lg transition cursor-pointer
                       bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed">
          &rarr;
        </button>
      </div>
      <span class="text-xs text-gray-400">Page {{ currentPage() }} of {{ totalPages() }}</span>
    </div>
  </div>
</div>
