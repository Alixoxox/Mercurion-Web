<div class="max-w-6xl mx-auto px-4 py-8">
  <a routerLink="/products" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-900 mb-6 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
    </svg>
    Back to Products
  </a>

  <div *ngIf="loading()" class="animate-pulse">
    <div class="flex flex-col md:flex-row gap-8">
      <div class="w-full md:w-1/2 aspect-square bg-gray-100 rounded-xl"></div>
      <div class="w-full md:w-1/2 space-y-4">
        <div class="h-6 bg-gray-100 rounded w-1/4"></div>
        <div class="h-8 bg-gray-100 rounded w-3/4"></div>
        <div class="h-6 bg-gray-100 rounded w-1/3"></div>
        <div class="h-4 bg-gray-100 rounded w-full"></div>
        <div class="h-4 bg-gray-100 rounded w-5/6"></div>
      </div>
    </div>
  </div>

  <div *ngIf="error()" class="text-center py-16">
    <p class="text-red-500 mb-4">{{ error() }}</p>
    <a routerLink="/products" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition inline-block">
      Back to Products
    </a>
  </div>

  <div *ngIf="!loading() && !error() && product() as p" class="flex flex-col md:flex-row gap-8 md:gap-12">
    <div class="w-full md:w-1/2 aspect-square p-8 bg-white rounded-xl border border-gray-200 flex items-center justify-center">
      <img [src]="p.image" [alt]="p.title" class="max-h-full max-w-full object-contain" />
    </div>

    <div class="w-full md:w-1/2 space-y-4">
      <span class="inline-block text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded">
        {{ p.category }}
      </span>

      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 leading-tight">{{ p.title }}</h1>

      <p class="text-3xl font-bold text-gray-900">${{ p.price }}</p>

      <div class="flex items-center gap-2 text-sm text-gray-500">
        <span class="text-yellow-500">★</span>
        <span>{{ p.rating.rate }} / 5</span>
        <span>({{ p.rating.count }} reviews)</span>
      </div>

      <hr class="border-gray-200" />

      <p class="text-gray-600 leading-relaxed">{{ p.description }}</p>

      <ng-container *ngIf="userService.loggedIn()">
        <div class="flex gap-3 pt-2">
          <ng-container *ngIf="isInCart(p)">
            <button (click)="deleteFromCart(p)"
                    class="flex-1 text-sm font-medium text-red-600 bg-red-50 border border-red-200 hover:bg-red-100 px-4 py-2.5 rounded-lg transition cursor-pointer">
              Remove from Cart
            </button>
          </ng-container>
          <button (click)="onAddToCart(p)"
                  [class.flex-1]="isInCart(p)"
                  [class.w-full]="!isInCart(p)"
                  class="text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 px-4 py-2.5 rounded-lg transition cursor-pointer">
            {{ isInCart(p) ? 'Add Another' : 'Add to Cart' }}
          </button>
        </div>
      </ng-container>
    </div>
  </div>

  <div *ngIf="!loading() && !error() && product()" class="mt-16">
    <h2 class="text-xl font-bold text-gray-900 mb-6">Related Products</h2>

    <div *ngIf="relatedLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div *ngFor="let _ of [1,2,3,4]" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden animate-pulse h-full flex flex-col">
        <div class="aspect-square bg-gray-100 shrink-0"></div>
        <div class="p-4 space-y-3 flex-1 flex flex-col">
          <div class="h-4 bg-gray-100 rounded w-1/4"></div>
          <div class="h-4 bg-gray-100 rounded w-3/4"></div>
          <div class="h-5 bg-gray-100 rounded w-1/3 mt-auto"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!relatedLoading() && relatedProducts().length > 0"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let rp of relatedProducts()"
        [product]="rp"
        [isLoggedIn]="userService.loggedIn()"
        [isInCart]="isInCart(rp)"
        (addToCart)="onAddToCart($event)"
        (deleteFromCart)="deleteFromCart($event)"/>
    </div>

    <div *ngIf="!relatedLoading() && relatedProducts().length === 0" class="text-center py-8">
      <p class="text-gray-400 text-sm">No related products found.</p>
    </div>
  </div>
</div>
