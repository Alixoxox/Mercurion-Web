<div>
  <h2 class="text-xl sm:text-2xl font-semibold text-gray-900 mb-1">Welcome back</h2>
  <p class="text-gray-500 mb-6">Sign in to your account</p>

  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="space-y-4 sm:space-y-5">

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
        Email
      </label>

      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition placeholder:text-gray-400" />

      <ng-container *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)">

        <p class="mt-1 text-sm text-red-500"
           *ngIf="loginForm.get('email')?.errors?.['required']">
          Email is required
        </p>

        <p class="mt-1 text-sm text-red-500"
           *ngIf="loginForm.get('email')?.errors?.['email']">
          Enter a valid email address
        </p>

      </ng-container>
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
        Password
      </label>

      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="Enter your password"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition placeholder:text-gray-400" />

      <p
        class="mt-1 text-sm text-red-500"
        *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)">
        Min 8 characters, with uppercase, lowercase &amp; a number
      </p>
    </div>

    <button
      type="submit"
      [disabled]="loginForm.invalid"
      class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-medium py-2.5 rounded-lg transition cursor-pointer disabled:cursor-not-allowed">
      Sign In
    </button>

  </form>

  <p class="text-center text-sm text-gray-500 mt-6">
    Don't have an account?
    <a routerLink="/auth/signup" class="text-blue-600 hover:text-blue-700 font-medium cursor-pointer">
      Sign up
    </a>
  </p>
</div>
